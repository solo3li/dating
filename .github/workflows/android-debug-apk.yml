name: Build & Auto-Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK with Auto Version
        # We use github.run_number to automatically increment the version string and build number.
        run: flutter build apk --debug --split-per-abi --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: debug-apks-v1.0.${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-debug.apk

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Auto Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: true
          files: build/app/outputs/flutter-apk/app-*-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
